[package]
name = "pets-core"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tiny_http = "0.12"
rand = "0.8"
dirs = "5"
notify = "6"
# read-only opencode database (spec 0.11 §4.1); enabled by the app, not included in `hook.exe`
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[features]
opencode-db = ["dep:rusqlite"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Time", "Win32_NetworkManagement_IpHelper", "Wdk_System_Threading"] }

[dev-dependencies]
tempfile = "3"
ureq = "2"
