# nginx for the landing page (see the Dockerfile at the repository root).
server {
    # IPv4 inside the container; Docker's port mapping serves IPv6 clients on hosts that have it.
    # (An explicit [::] listener would stop nginx on hosts without IPv6.)
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;  # text/html is always compressed

    # The page is one file that changes with every build: always check for a newer one (ETag makes it cheap).
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Inline script and styles are the page itself; fonts come from Google Fonts, the release list from the GitHub API.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Any other path shows the page (its sections are #anchors, so there are no other routes).
    location / {
        try_files $uri /index.html;
    }
}
