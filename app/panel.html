<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Agent Pets</title>
<style>
:root{
  --bg:#F3F3F3;--card:#FBFBFB;--line:rgba(0,0,0,.08);--edge:rgba(0,0,0,.14);--txt:#1F1F1F;--mut:#5F5E5A;
  --track:rgba(0,0,0,.08);--btn:#FFFFFF;--btnh:#F6F6F6;--btnb:rgba(0,0,0,.12);--focus:rgba(217,119,87,.14);
  --claude:#D97757;--codex:#5DCAA5;--hot:#E24B4A;--needs:#EF9F27;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#202020;--card:#2B2B2B;--line:rgba(255,255,255,.06);--edge:rgba(255,255,255,.1);--txt:#F3F3F3;--mut:#A5A298;
  --track:rgba(255,255,255,.1);--btn:#373737;--btnh:#3D3D3D;--btnb:rgba(255,255,255,.08);--focus:rgba(217,119,87,.22)}}
:root[data-theme="dark"]{
  --bg:#202020;--card:#2B2B2B;--line:rgba(255,255,255,.06);--edge:rgba(255,255,255,.1);--txt:#F3F3F3;--mut:#A5A298;
  --track:rgba(255,255,255,.1);--btn:#373737;--btnh:#3D3D3D;--btnb:rgba(255,255,255,.08);--focus:rgba(217,119,87,.22)}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--txt)}
#root{height:100%}
.panel{box-sizing:border-box;height:100%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
header{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 8px}
h1{margin:0;font:600 15px/1.2 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
.count{color:var(--mut);font-size:12px}
.limits{margin:0 12px 8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;display:grid;gap:6px}
.limit{display:grid;grid-template-columns:96px 1fr 38px 104px;align-items:center;gap:8px;font-size:12px}
.limit .label{color:var(--mut)}
.limit .none{grid-column:2 / -1;color:var(--mut);font-style:italic}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar.claude i{background:var(--claude)}
.bar.codex i{background:var(--codex)}
.bar i.hot{background:var(--hot)}
.pct{text-align:right;font-variant-numeric:tabular-nums}
.reset{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessions{flex:1;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.empty{margin:32px 0;text-align:center;color:var(--mut)}
.session{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;padding:4px 10px 4px 4px;background:var(--card);border:1px solid var(--line);border-radius:6px;transition:background .3s}
.session.focus{background:var(--focus)}
.session.needs_you{box-shadow:inset 3px 0 0 var(--needs)}
.session.error{box-shadow:inset 3px 0 0 var(--hot)}
.pet{display:block;width:96px;height:72px}
.info{min-width:0}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:0 10px;margin-top:2px;font-size:12px;color:var(--mut)}
.meta .state{color:var(--txt)}
.session.needs_you .meta .state{color:var(--needs);font-weight:600}
.session.error .meta .state{color:var(--hot);font-weight:600}
.meta .router-hot{color:var(--needs);font-weight:600}
button{font:inherit;font-size:12px;padding:5px 12px;border-radius:4px;border:1px solid var(--btnb);background:var(--btn);color:var(--txt);cursor:pointer}
button:hover{background:var(--btnh)}
button:focus-visible{outline:2px solid var(--txt);outline-offset:1px}
.status{padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/panel/main.tsx"></script>
</body>
</html>
