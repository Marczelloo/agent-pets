<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>agent-pets-stage</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;font-family:system-ui}
#tb{display:block;width:100%;height:100%}#hidden{display:none}</style>
<script>
// limit klatek do pomiarów S2: ustaw window.__FPS (0 = natywne rAF)
window.__FPS = 60;
if (window.__FPS) {
  const step = 1000 / window.__FPS;
  let next = performance.now();
  window.requestAnimationFrame = cb => {
    next += step;
    const now = performance.now();
    if (next < now) next = now;
    return setTimeout(() => cb(performance.now()), next - now);
  };
}
</script>
</head>
<body>
<canvas id="tb"></canvas>
<div id="hidden"><canvas id="cv"></canvas><div id="btns"></div><div id="tools"></div><div id="sty"></div><label id="lbl"><input type="checkbox" id="slow"></label></div>
<script src="/pets.js"></script>
<script>
const jl = m => window.__TAURI__ && window.__TAURI__.core.invoke('js_log', { msg: m });
const info = () => `dpr=${devicePixelRatio} css=${innerWidth}x${innerHeight}`;
jl('load ' + info());
addEventListener('resize', () => jl('resize ' + info()));
addEventListener('click', e => jl(`click at ${e.clientX},${e.clientY}`));
</script>
</body>
</html>
