[workspace]
resolver = "2"
members = ["crates/pets-core", "crates/pets-hook", "crates/pets-cli"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release.package.pets-hook]
opt-level = "z"
