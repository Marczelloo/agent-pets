# Tests on every push to main, every pull request and every v* tag. The installer with its update
# signature is built locally with scripts/release.ps1 (the signing key stays local; docs/building.md).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # a hung test fails the run instead of holding a runner for six hours
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # the packaged resources/hook.exe must exist before anything compiles the app
      - run: pnpm build:hook
        working-directory: app
      - run: cargo test --workspace
      - run: pnpm exec tsc --noEmit
        working-directory: app
      - run: pnpm test
        working-directory: app
