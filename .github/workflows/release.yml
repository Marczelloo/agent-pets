# Tag v*: tests. Build the installer with an update signature locally using scripts/release.ps1 (the signing key stays local; docs/building.md).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # the packaged resources/hook.exe must exist before anything compiles the app
      - run: pnpm build:hook
        working-directory: app
      - run: cargo test --workspace
      - run: pnpm test
        working-directory: app
